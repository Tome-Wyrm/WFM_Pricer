[package]
name = "wfm-pricer"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
dotenvy = "0.15"
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding"] }
chrono = { version = "0.4", features = ["serde"] }
